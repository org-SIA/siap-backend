# Stack complète : API (php-fpm) + Nginx + PostgreSQL + Redis (cache/queue) + worker de notifications.
#
#   docker compose up -d --build     → démarre tout ; l'image se construit avec Composer (accès Internet requis)
#   docker compose logs -f app       → voir les logs de l'API
#   docker compose exec app php artisan test
#
# API disponible sur http://localhost:8000 — Swagger sur http://localhost:8000/docs/api
services:
  app:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "true" # ce conteneur exécute les migrations au démarrage ; les autres non (voir plus bas)
    volumes:
      - siap_storage:/var/www/html/storage/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8000:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  queue:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "false" # les migrations sont déjà gérées par le conteneur "app"
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3"]
    volumes:
      - siap_storage:/var/www/html/storage/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siap
      POSTGRES_USER: siap
      POSTGRES_PASSWORD: siap
    ports: ["5432:5432"] # pratique pour se connecter avec un client SQL depuis la machine hôte
    volumes:
      - siap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - siap_redisdata:/data

volumes:
  siap_pgdata:
  siap_redisdata:
  siap_storage:
