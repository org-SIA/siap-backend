# Secours pour qui préfère exécuter PHP en local (via setup.sh) plutôt qu'en conteneur :
# ne fournit que PostgreSQL + Redis.  Usage : docker compose -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siap
      POSTGRES_USER: siap
      POSTGRES_PASSWORD: siap
    ports: ["5432:5432"]
    volumes: ["siap_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siap"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["siap_redisdata:/data"]

volumes:
  siap_pgdata:
  siap_redisdata:
